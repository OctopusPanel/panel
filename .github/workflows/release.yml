name: Release Panel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.3.0)'
        required: false
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Panel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm run build

      - name: Package artifacts
        run: |
          mkdir -p dist-release
          TAR_NAME="octopus-panel-${{ github.ref_name || inputs.tag }}.tar.gz"
          tar -czf "dist-release/${TAR_NAME}" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.turbo' \
            --exclude='dist-release' \
            .
          cd dist-release
          sha256sum "${TAR_NAME}" > "${TAR_NAME}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: OctopusPanel ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: |
            dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
